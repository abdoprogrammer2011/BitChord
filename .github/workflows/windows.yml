name: Windows companion

on:
  push:
    branches:
      - main
      - "**"
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-winui:
    name: Build WinUI 3 and MSIX
    runs-on: windows-2022

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"

      - name: Restore WinUI project
        run: dotnet restore windows/BitChord.WinUI/BitChord.WinUI.csproj

      - name: Build WinUI project
        run: dotnet build windows/BitChord.WinUI/BitChord.WinUI.csproj --configuration Release --no-restore --runtime win-x64

      - name: Build unsigned MSIX package
        shell: pwsh
        run: |
          $msbuild = Get-ChildItem "${env:ProgramFiles}\Microsoft Visual Studio\2022" -Filter MSBuild.exe -Recurse |
            Where-Object { $_.FullName -match "MSBuild\\Current\\Bin\\MSBuild.exe$" } |
            Select-Object -First 1
          if (-not $msbuild) {
            throw "MSBuild was not found on the hosted Windows runner."
          }

          & $msbuild.FullName windows/BitChord.Package/BitChord.Package.wapproj `
            /t:Restore,Build `
            /p:Configuration=Release `
            /p:Platform=x64 `
            /p:AppxPackageSigningEnabled=false `
            /p:AppxBundle=Always `
            /p:UapAppxPackageBuildMode=SideloadOnly `
            /p:AppxPackageDir="${{ github.workspace }}\windows\artifacts\"

      - name: Upload MSIX artifacts
        uses: actions/upload-artifact@v4
        with:
          name: bitchord-windows-msix-${{ github.run_number }}
          path: |
            windows/artifacts/**/*.msix
            windows/artifacts/**/*.msixbundle
            windows/artifacts/**/*.cer
            windows/BitChord.Package/AppPackages/**
          if-no-files-found: error
          retention-days: 14
