name: Windows companion

on:
  push:
    branches:
      - main
      - "**"
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-winui:
    name: Build WinUI 3 and MSIX
    runs-on: windows-2022

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Visual Studio MSBuild
        uses: microsoft/setup-msbuild@v2

      - name: Restore solution packages
        run: dotnet restore windows/BitChord.sln

      - name: Build solution and unsigned MSIX package
        shell: pwsh
        run: |
          $msbuild = Get-ChildItem "${env:ProgramFiles}\Microsoft Visual Studio\2022" -Filter MSBuild.exe -Recurse |
            Where-Object { $_.FullName -match "MSBuild\\Current\\Bin\\MSBuild.exe$" } |
            Select-Object -First 1
          if (-not $msbuild) {
            throw "MSBuild was not found on the hosted Windows runner."
          }

          $solution = Join-Path $env:GITHUB_WORKSPACE "windows\BitChord.sln"
          if (-not (Test-Path $solution)) {
            throw "BitChord.sln was not found at $solution."
          }

          & $msbuild.FullName $solution `
            /p:Configuration=Release `
            /p:Platform=x64 `
            /p:RuntimeIdentifier=win-x64 `
            /p:OutputPath="${{ github.workspace }}\windows\BitChord.Package\bin\Release\" `
            /p:BaseOutputPath="${{ github.workspace }}\windows\BitChord.Package\bin\" `
            /p:AppxPackageSigningEnabled=false `
            /p:AppxBundle=Always `
            /p:UapAppxPackageBuildMode=SideloadOnly `
            /p:AppxPackageDir="${{ github.workspace }}\windows\artifacts\" `
            /v:minimal
          if ($LASTEXITCODE -ne 0) {
            throw "BitChord solution build failed with exit code $LASTEXITCODE."
          }

      - name: Upload MSIX artifacts
        uses: actions/upload-artifact@v4
        with:
          name: bitchord-windows-msix-${{ github.run_number }}
          path: |
            windows/artifacts/**/*.msix
            windows/artifacts/**/*.msixbundle
            windows/artifacts/**/*.cer
            windows/BitChord.Package/AppPackages/**
          if-no-files-found: error
          retention-days: 14
